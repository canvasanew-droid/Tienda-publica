<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<title>Tu carrito — Anew Canvas Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FBF6F3; --ink: #2A211F; --wine: #7A2E3A; --wine-dark: #5E2129;
    --gold: #C9A768; --line: #E7DAD3; --error: #B23B3B; --ok: #2F6B4F;
  }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100dvh; background:var(--bg); font-family:'Inter',sans-serif; color:var(--ink); }
  .wrap { max-width:520px; margin:0 auto; padding:20px 16px 40px; min-height:100dvh; }

  .volver { font-size:13px; color:var(--wine); text-decoration:none; font-weight:500; display:inline-block; margin-bottom:14px; }
  h1 { font-family:'Fraunces',serif; font-weight:600; font-size:24px; margin:0 0 18px; }
  h2 { font-family:'Fraunces',serif; font-weight:600; font-size:17px; margin:28px 0 12px; }

  .empty-state { text-align:center; padding:60px 20px; }
  .empty-state p { color:#8A7A74; font-size:14px; margin-bottom:18px; }
  .empty-state a {
    display:inline-block; background:var(--wine); color:#fff; text-decoration:none;
    padding:12px 22px; border-radius:999px; font-size:14px; font-weight:600;
  }

  .item-row {
    display:flex; gap:12px; padding:12px 0; border-bottom:1px solid var(--line);
  }
  .item-row img { width:64px; height:64px; object-fit:cover; border-radius:10px; background:var(--line); flex-shrink:0; }
  .item-row .info { flex:1; min-width:0; }
  .item-row .marca { font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--wine); font-weight:600; }
  .item-row .nombre { font-size:13.5px; font-weight:500; line-height:1.3; }
  .item-row .tono { font-size:12px; color:#6B5E5A; }
  .item-row .quitar { font-size:12px; color:var(--error); background:none; border:none; padding:0; margin-top:4px; cursor:pointer; }

  .qty-controls { display:flex; align-items:center; gap:8px; margin-top:6px; }
  .qty-controls button {
    width:26px; height:26px; border-radius:8px; border:1.5px solid var(--line); background:#fff;
    font-size:15px; cursor:pointer; line-height:1;
  }
  .qty-controls span { font-size:13px; font-weight:600; min-width:18px; text-align:center; }

  .item-row .precios { text-align:right; flex-shrink:0; }
  .item-row .subtotal { font-family:'Fraunces',serif; font-size:15px; font-weight:600; }
  .item-row .unitario { font-size:11px; color:#8A7A74; margin-top:1px; }
  .nivel-badge {
    font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:.03em;
    padding:2px 7px; border-radius:999px; display:inline-block; margin-top:3px;
  }
  .nivel-detal { background:var(--line); color:#6B5E5A; }
  .nivel-mayor { background:#EFDFC4; color:#8A5A1E; }
  .nivel-gran_mayor { background:var(--wine); color:#fff; }

  .aviso-umbral {
    font-size:12.5px; background:#F3E9D8; color:#6B4F1E; padding:10px 12px; border-radius:10px; margin-top:14px;
  }

  label { display:block; font-size:13px; font-weight:500; margin-bottom:6px; margin-top:16px; }
  input[type=text], input[type=tel], textarea {
    width:100%; padding:12px 13px; border:1.5px solid var(--line); border-radius:10px;
    font-size:14px; font-family:'Inter',sans-serif; background:#fff; color:var(--ink);
  }
  textarea { resize:vertical; min-height:60px; }
  input:focus, textarea:focus { outline:none; border-color:var(--wine); }

  .metodo-entrega { display:flex; flex-direction:column; gap:8px; margin-top:8px; }
  .metodo-entrega label {
    display:flex; align-items:center; gap:10px; margin:0; padding:12px; border:1.5px solid var(--line);
    border-radius:10px; font-size:13.5px; font-weight:500; cursor:pointer;
  }
  .metodo-entrega input { width:auto; margin:0; }

  .total-bar { display:flex; justify-content:space-between; align-items:baseline; margin-top:24px; padding-top:16px; border-top:2px solid var(--ink); }
  .total-bar .label { font-size:13px; color:#6B5E5A; }
  .total-bar .valor { font-family:'Fraunces',serif; font-size:24px; font-weight:600; }

  .btn-whatsapp {
    display:block; width:100%; margin-top:20px; background:var(--wine); color:#fff; border:none;
    padding:16px; border-radius:14px; font-size:15px; font-weight:600; font-family:'Inter',sans-serif;
    cursor:pointer; text-align:center; text-decoration:none;
  }
  .btn-whatsapp:disabled { background:var(--line); color:#8A7A74; cursor:default; }
  #formStatus { font-size:13px; color:var(--error); margin-top:8px; min-height:16px; text-align:center; }
</style>
</head>
<body>
  <div class="wrap">
    <a href="index.html" class="volver">← Seguir viendo productos</a>
    <h1>Tu carrito</h1>

    <div id="contenido"></div>
  </div>

<script>
  // IMPORTANT: replace with the real WhatsApp number, country code
  // first, digits only (no +, no spaces, no dashes). Example for
  // Venezuela: "584141234567".
  const WHATSAPP_NUMBER = "584124405545";

  const UMBRAL_MAYOR = 3;
  const UMBRAL_GRAN_MAYOR = 10;

  const contenido = document.getElementById('contenido');

  function leerCarrito() {
    try { return JSON.parse(localStorage.getItem('carrito') || '[]'); }
    catch (e) { return []; }
  }
  function guardarCarrito(cart) {
    localStorage.setItem('carrito', JSON.stringify(cart));
  }

  // --- Misma regla de negocio que el panel interno: "mayor" aplica por
  // línea si esa línea tiene 3+ unidades del mismo producto; "gran mayor"
  // sube TODO el carrito si la suma total de unidades llega a 10. ---
  function calcularCarrito(cart) {
    const totalUnidades = cart.reduce(function (sum, item) { return sum + item.cantidad; }, 0);
    const granMayorActivo = totalUnidades >= UMBRAL_GRAN_MAYOR;

    const lineas = cart.map(function (item) {
      let nivel, precioUnitario;
      if (granMayorActivo) {
        nivel = 'gran_mayor';
        precioUnitario = item.precio_gran_mayor;
      } else if (item.cantidad >= UMBRAL_MAYOR) {
        nivel = 'mayor';
        precioUnitario = item.precio_mayor;
      } else {
        nivel = 'detal';
        precioUnitario = item.precio_detal;
      }
      return { nivel: nivel, precioUnitario: precioUnitario, subtotal: precioUnitario * item.cantidad };
    });

    const total = lineas.reduce(function (sum, l) { return sum + l.subtotal; }, 0);
    return { lineas: lineas, total: total, totalUnidades: totalUnidades, granMayorActivo: granMayorActivo };
  }

  function etiquetaNivel(nivel) {
    if (nivel === 'mayor') return 'Mayor';
    if (nivel === 'gran_mayor') return 'Gran mayor';
    return 'Detal';
  }

  function render() {
    const cart = leerCarrito();

    if (cart.length === 0) {
      contenido.innerHTML =
        '<div class="empty-state">' +
          '<p>Todavía no has agregado nada a tu carrito.</p>' +
          '<a href="index.html">Ver productos</a>' +
        '</div>';
      return;
    }

    const calculo = calcularCarrito(cart);

    let itemsHtml = '';
    cart.forEach(function (item, i) {
      const linea = calculo.lineas[i];
      itemsHtml +=
        '<div class="item-row">' +
          '<img src="' + (item.imagen_url || '') + '" alt="" />' +
          '<div class="info">' +
            (item.marca ? '<div class="marca">' + item.marca + '</div>' : '') +
            '<div class="nombre">' + item.nombre + '</div>' +
            '<div class="tono">' + (item.tono || 'Único') + '</div>' +
            '<div class="qty-controls">' +
              '<button type="button" data-accion="restar" data-i="' + i + '">−</button>' +
              '<span>' + item.cantidad + '</span>' +
              '<button type="button" data-accion="sumar" data-i="' + i + '">+</button>' +
            '</div>' +
            '<button type="button" class="quitar" data-accion="quitar" data-i="' + i + '">Quitar</button>' +
          '</div>' +
          '<div class="precios">' +
            '<div class="subtotal">$' + linea.subtotal.toFixed(2) + '</div>' +
            '<div class="unitario">$' + linea.precioUnitario.toFixed(2) + ' c/u × ' + item.cantidad + '</div>' +
            '<div class="nivel-badge nivel-' + linea.nivel + '">' + etiquetaNivel(linea.nivel) + '</div>' +
          '</div>' +
        '</div>';
    });

    let avisoHtml = '';
    if (!calculo.granMayorActivo && calculo.totalUnidades >= UMBRAL_GRAN_MAYOR - 3) {
      const faltan = UMBRAL_GRAN_MAYOR - calculo.totalUnidades;
      if (faltan > 0) {
        avisoHtml = '<div class="aviso-umbral">Agrega ' + faltan + ' unidad' + (faltan === 1 ? '' : 'es') + ' más (de cualquier producto) para desbloquear el precio de gran mayor en todo tu pedido.</div>';
      }
    }

    contenido.innerHTML =
      itemsHtml +
      avisoHtml +
      '<h2>Tus datos</h2>' +
      '<label for="clienteNombre">Nombre</label>' +
      '<input type="text" id="clienteNombre" placeholder="Tu nombre" />' +
      '<label for="clienteTelefono">Teléfono</label>' +
      '<input type="tel" id="clienteTelefono" placeholder="Ej: 0414-1234567" />' +

      '<label>Entrega</label>' +
      '<div class="metodo-entrega">' +
        '<label><input type="radio" name="entrega" value="Retiro en tienda" checked /> Retiro en tienda</label>' +
        '<label><input type="radio" name="entrega" value="Delivery" /> Delivery</label>' +
        '<label><input type="radio" name="entrega" value="Envío nacional" /> Envío nacional (MRW, Zoom, Tealca...)</label>' +
      '</div>' +
      '<div id="direccionBox" style="display:none;">' +
        '<label for="clienteDireccion">Dirección / datos de envío</label>' +
        '<textarea id="clienteDireccion" placeholder="Dirección, punto de referencia, o agencia y sucursal si es envío nacional"></textarea>' +
      '</div>' +

      '<div class="total-bar">' +
        '<span class="label">Total (' + calculo.totalUnidades + (calculo.totalUnidades === 1 ? ' unidad' : ' unidades') + ')</span>' +
        '<span class="valor">$' + calculo.total.toFixed(2) + '</span>' +
      '</div>' +

      '<button type="button" class="btn-whatsapp" id="finalizarBtn">Finalizar pedido por WhatsApp</button>' +
      '<div id="formStatus"></div>';

    // Botones de cantidad / quitar
    contenido.querySelectorAll('[data-accion]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        const i = parseInt(btn.dataset.i, 10);
        const cart = leerCarrito();
        if (btn.dataset.accion === 'sumar') cart[i].cantidad += 1;
        if (btn.dataset.accion === 'restar') cart[i].cantidad = Math.max(1, cart[i].cantidad - 1);
        if (btn.dataset.accion === 'quitar') cart.splice(i, 1);
        guardarCarrito(cart);
        render();
      });
    });

    // Mostrar/ocultar dirección según el método de entrega
    contenido.querySelectorAll('input[name="entrega"]').forEach(function (radio) {
      radio.addEventListener('change', function () {
        document.getElementById('direccionBox').style.display = radio.value === 'Retiro en tienda' ? 'none' : 'block';
      });
    });

    document.getElementById('finalizarBtn').addEventListener('click', finalizarPedido);
  }

  function finalizarPedido() {
    const statusEl = document.getElementById('formStatus');
    const nombre = document.getElementById('clienteNombre').value.trim();
    const telefono = document.getElementById('clienteTelefono').value.trim();
    const entrega = document.querySelector('input[name="entrega"]:checked').value;
    const direccion = document.getElementById('clienteDireccion') ? document.getElementById('clienteDireccion').value.trim() : '';

    if (!nombre || !telefono) {
      statusEl.textContent = 'Por favor completa tu nombre y teléfono.';
      return;
    }
    if (entrega !== 'Retiro en tienda' && !direccion) {
      statusEl.textContent = 'Por favor indica la dirección o datos de envío.';
      return;
    }

    statusEl.textContent = '';

    const cart = leerCarrito();
    const calculo = calcularCarrito(cart);

    let mensaje = '¡Hola! Quiero hacer un pedido en Anew Canvas Store:\n\n';
    cart.forEach(function (item, i) {
      const linea = calculo.lineas[i];
      mensaje += '• ' + item.cantidad + 'x ' + item.nombre + ' (' + (item.tono || 'Único') + ') — $' + linea.subtotal.toFixed(2) + '\n';
    });
    mensaje += '\nTotal: $' + calculo.total.toFixed(2);
    mensaje += '\n\nNombre: ' + nombre;
    mensaje += '\nTeléfono: ' + telefono;
    mensaje += '\nEntrega: ' + entrega;
    if (direccion) mensaje += '\nDirección/datos de envío: ' + direccion;

    const url = 'https://wa.me/' + WHATSAPP_NUMBER + '?text=' + encodeURIComponent(mensaje);
    window.location.href = url;
  }

  render();
</script>
</body>
</html>
