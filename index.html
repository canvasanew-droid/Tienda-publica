<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<title>Anew Canvas Store — Maquillaje y Skincare</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F3F7FE; --ink: #0B1440; --wine: #1660E0; --wine-dark: #021880;
    --gold: #C9A768; --line: #DCE6F8; --error: #B23B3B; --ok: #2F6B4F;
  }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100dvh; background:var(--bg); font-family:'Inter',sans-serif; color:var(--ink); }
  .wrap { max-width:520px; margin:0 auto; padding:20px 16px 100px; min-height:100dvh; }

  @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
  @keyframes fadeInUp { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
  @keyframes popIn { 0% { transform:scale(1); } 40% { transform:scale(1.18); } 100% { transform:scale(1); } }
  @keyframes shimmer { 0% { background-position:-200px 0; } 100% { background-position:200px 0; } }

  header { text-align:center; padding:16px 0 14px; }
  .logo { width:104px; height:104px; border-radius:22px; box-shadow:0 6px 18px rgba(2,24,128,.22); margin-bottom:10px; }
  .eyebrow { font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--wine); margin-bottom:6px; font-weight:600; }
  h1 { font-family:'Fraunces',serif; font-weight:600; font-size:26px; margin:0; line-height:1.1; }

  .banner {
    background:linear-gradient(135deg, #2686F5 0%, var(--wine-dark) 100%);
    border-radius:16px; padding:16px 18px; margin-bottom:16px; color:#fff; text-align:center;
    box-shadow:0 8px 20px rgba(2,24,128,.18);
  }
  .banner strong { font-family:'Fraunces',serif; font-size:16px; display:block; margin-bottom:2px; }
  .banner span { font-size:12.5px; opacity:.9; }

  .search-box { position:relative; margin-bottom:12px; }
  .search-box input {
    width:100%; padding:13px 14px; border:1.5px solid var(--line); border-radius:12px;
    font-size:15px; font-family:'Inter',sans-serif; background:#fff; color:var(--ink);
    transition:border-color .15s ease;
  }
  .search-box input:focus { outline:none; border-color:var(--wine); }

  .categoria-selector {
    display:flex; align-items:center; gap:8px; margin-bottom:14px;
  }
  .btn-categorias {
    display:flex; align-items:center; gap:6px; padding:10px 14px; border-radius:10px;
    border:1.5px solid var(--line); background:#fff; color:var(--ink); font-size:13.5px; font-weight:600;
    cursor:pointer; transition:transform .1s ease;
  }
  .btn-categorias:active { transform:scale(.96); }
  .btn-categorias .flecha { font-size:10px; color:var(--wine); }
  .categoria-chip-activa {
    display:flex; align-items:center; gap:6px; padding:8px 12px; border-radius:999px;
    background:var(--wine); color:#fff; font-size:12.5px; font-weight:600; animation:fadeIn .2s ease;
  }
  .categoria-chip-activa button { background:none; border:none; color:#fff; font-size:13px; cursor:pointer; padding:0; line-height:1; opacity:.85; }

  .cat-overlay {
    display:flex; position:fixed; inset:0; background:rgba(11,20,64,0); z-index:25;
    align-items:flex-end; justify-content:center; pointer-events:none; transition:background-color .22s ease;
  }
  .cat-overlay.open { background:rgba(11,20,64,.55); pointer-events:auto; }
  .cat-sheet {
    background:var(--bg); width:100%; max-width:520px; border-radius:20px 20px 0 0;
    padding:20px; max-height:80vh; overflow-y:auto;
    transform:translateY(100%); transition:transform .28s cubic-bezier(.22,.68,0,1.1);
  }
  .cat-overlay.open .cat-sheet { transform:translateY(0); }
  .cat-sheet h2 { font-family:'Fraunces',serif; font-size:18px; margin:0 0 14px; }
  .cat-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .cat-grid button {
    text-align:left; padding:12px 14px; border-radius:10px; border:1.5px solid var(--line);
    background:#fff; color:var(--ink); font-size:13.5px; font-weight:500; cursor:pointer;
    transition:background-color .15s ease, border-color .15s ease, color .15s ease;
  }
  .cat-grid button.active { background:var(--wine); border-color:var(--wine); color:#fff; }
  .cerrar-cat-sheet {
    display:block; margin:16px auto 0; background:none; border:none; color:#8A7A74; font-size:13px; cursor:pointer;
  }

  .grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:8px; animation:fadeIn .25s ease; }
  .producto-card {
    background:#fff; border:1px solid var(--line); border-radius:14px; overflow:hidden; cursor:pointer;
    display:flex; flex-direction:column; animation:fadeInUp .3s ease backwards;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .producto-card:active { transform:scale(.97); box-shadow:0 2px 10px rgba(42,33,31,.10); }
  .producto-card img { width:100%; aspect-ratio:1; object-fit:cover; background:var(--line); }
  .producto-card .info { padding:11px 12px 13px; flex:1; display:flex; flex-direction:column; }
  .producto-card .marca { font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--wine); font-weight:600; margin-bottom:2px; }
  .producto-card .nombre { font-size:13.5px; font-weight:500; line-height:1.35; margin-bottom:8px; flex:1; }
  .producto-card .precio-fila { display:flex; align-items:center; justify-content:space-between; }
  .producto-card .precio { font-family:'Fraunces',serif; font-size:17.5px; font-weight:600; }
  .quick-add {
    width:30px; height:30px; border-radius:50%; border:none; background:var(--wine); color:#fff;
    font-size:17px; line-height:1; cursor:pointer; flex-shrink:0; transition:transform .12s ease, background-color .12s ease;
  }
  .quick-add:active { transform:scale(.85); background:var(--wine-dark); }

  .empty-msg { text-align:center; font-size:13px; color:#8A7A74; padding:40px 20px; grid-column:1/-1; animation:fadeIn .25s ease; }

  /* --- Estado de carga (esqueleto) --- */
  .skeleton-card { border-radius:14px; overflow:hidden; background:#fff; border:1px solid var(--line); }
  .skeleton-img, .skeleton-line {
    background:linear-gradient(90deg, var(--line) 25%, #F3E8E1 37%, var(--line) 63%);
    background-size:400px 100%; animation:shimmer 1.4s ease infinite;
  }
  .skeleton-img { width:100%; aspect-ratio:1; }
  .skeleton-line { height:11px; border-radius:5px; margin:11px 12px 0; }
  .skeleton-line.corta { width:55%; margin-bottom:13px; }

  /* --- Toast de confirmación --- */
  .toast {
    position:fixed; top:18px; left:50%; transform:translateX(-50%) translateY(-10px);
    background:var(--ink); color:#fff; font-size:13px; font-weight:500; padding:10px 18px;
    border-radius:999px; z-index:40; opacity:0; pointer-events:none; transition:opacity .2s ease, transform .2s ease;
  }
  .toast.visible { opacity:1; transform:translateX(-50%) translateY(0); }


  /* --- Modal de producto (tonos + agregar) --- */
  .overlay {
    display:flex; position:fixed; inset:0; background:rgba(42,33,31,0); z-index:20;
    align-items:flex-end; justify-content:center; pointer-events:none;
    transition:background-color .22s ease;
  }
  .overlay.open { background:rgba(42,33,31,.5); pointer-events:auto; }
  .sheet {
    background:var(--bg); width:100%; max-width:520px; border-radius:20px 20px 0 0;
    padding:20px; max-height:85vh; overflow-y:auto;
    transform:translateY(100%); transition:transform .28s cubic-bezier(.22,.68,0,1.1);
  }
  .overlay.open .sheet { transform:translateY(0); }
  .sheet img { width:100%; aspect-ratio:1; object-fit:cover; border-radius:12px; margin-bottom:14px; background:var(--line); }
  .sheet .marca { font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--wine); font-weight:600; }
  .sheet h2 { font-family:'Fraunces',serif; font-size:20px; margin:4px 0 8px; }
  .sheet .descripcion { font-size:13.5px; color:#5A4D48; line-height:1.5; margin-bottom:16px; white-space:pre-line; }
  .precios-nivel { border:1px solid var(--line); border-radius:12px; padding:4px 12px; margin-bottom:16px; }
  .precio-nivel { display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-bottom:1px solid var(--line); }
  .precio-nivel:last-child { border-bottom:none; }
  .precio-nivel .etiqueta { font-size:12.5px; color:#6B5E5A; }
  .precio-nivel .monto { font-family:'Fraunces',serif; font-size:15px; font-weight:600; }
  .tono-row {
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:10px 0; border-top:1px solid var(--line);
  }
  .tono-row .tono-nombre { font-size:14px; font-weight:500; }
  .tono-row .tono-precio { font-size:13px; color:#6B5E5A; }
  .tono-row button {
    padding:8px 16px; border-radius:999px; border:none; background:var(--wine); color:#fff;
    font-size:13px; font-weight:600; cursor:pointer; flex-shrink:0;
  }
  .cerrar-sheet {
    display:block; margin:16px auto 0; background:none; border:none; color:#8A7A74; font-size:13px; cursor:pointer;
  }
  .qty-controls { display:flex; align-items:center; gap:10px; }
  .qty-controls button {
    width:30px; height:30px; border-radius:9px; border:1.5px solid var(--line); background:#fff;
    font-size:16px; cursor:pointer; line-height:1;
  }
  .qty-controls button:disabled { opacity:.4; cursor:default; }
  .qty-controls span { font-size:14px; font-weight:600; min-width:20px; text-align:center; }

  /* --- Barra de carrito flotante --- */
  .cart-bar {
    position:fixed; bottom:16px; left:16px; right:16px; max-width:488px; margin:0 auto;
    background:var(--wine); color:#fff; border-radius:14px; padding:14px 18px;
    display:none; align-items:center; justify-content:space-between;
    box-shadow:0 8px 24px rgba(42,33,31,.25); text-decoration:none; font-family:'Inter',sans-serif;
    transition:transform .15s ease;
  }
  .cart-bar.visible { display:flex; animation:fadeInUp .25s ease; }
  .cart-bar.pop { animation:popIn .28s ease; }
  .cart-bar .izq { font-size:13px; opacity:.85; }
  .cart-bar .der { font-family:'Fraunces',serif; font-size:16px; font-weight:600; }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <img src="logo.png" alt="Anew Canvas Store" class="logo" />
      <div class="eyebrow">Valencia, Venezuela</div>
    </header>

    <div class="banner">
      <strong>¡Vendemos al mayor y al detal!</strong>
      <span>Descuentos automáticos según la cantidad que agregues al carrito</span>
    </div>

    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Buscar por nombre o marca..." />
    </div>

    <div class="categoria-selector" id="categoriaSelector"></div>

    <div class="grid" id="grid"></div>
  </div>

  <div class="toast" id="toast"></div>

  <div class="cat-overlay" id="catOverlay">
    <div class="cat-sheet">
      <h2>Categorías</h2>
      <div class="cat-grid" id="catGrid"></div>
      <button class="cerrar-cat-sheet" id="cerrarCatSheetBtn">Cerrar</button>
    </div>
  </div>


  <div class="overlay" id="overlay">
    <div class="sheet">
      <img id="sheetImagen" src="" alt="" />
      <div class="marca" id="sheetMarca"></div>
      <h2 id="sheetNombre"></h2>
      <div class="descripcion" id="sheetDescripcion"></div>
      <div id="sheetPrecios" class="precios-nivel"></div>
      <div id="sheetTonos"></div>
      <button class="cerrar-sheet" id="cerrarSheetBtn">Cerrar</button>
    </div>
  </div>

  <a href="carrito.html" class="cart-bar" id="cartBar">
    <span class="izq" id="cartBarCantidad">0 productos</span>
    <span class="der" id="cartBarTotal">$0.00</span>
  </a>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = "https://pvlpawwimdbxsvgggima.supabase.co";
  const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_dqOJoYPxXWIQojgdxC6IKg_jE_jhTzh";
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

  const gridEl = document.getElementById('grid');
  const categoriaSelector = document.getElementById('categoriaSelector');
  const catOverlay = document.getElementById('catOverlay');
  const catGrid = document.getElementById('catGrid');
  const searchInput = document.getElementById('searchInput');
  const overlay = document.getElementById('overlay');
  const cartBar = document.getElementById('cartBar');
  const cartBarCantidad = document.getElementById('cartBarCantidad');
  const cartBarTotal = document.getElementById('cartBarTotal');

  let todasLasVariantes = [];
  let categoriaActiva = 'Todas';

  function mostrarToast(mensaje) {
    const toast = document.getElementById('toast');
    toast.textContent = mensaje;
    toast.classList.add('visible');
    clearTimeout(toast._timeoutId);
    toast._timeoutId = setTimeout(function () { toast.classList.remove('visible'); }, 1400);
  }

  function mostrarEsqueleto() {
    let html = '';
    for (let i = 0; i < 6; i++) {
      html += '<div class="skeleton-card"><div class="skeleton-img"></div><div class="skeleton-line"></div><div class="skeleton-line corta"></div></div>';
    }
    gridEl.innerHTML = html;
  }
  mostrarEsqueleto();

  // --- Carrito: guardado en localStorage para que sobreviva el cambio a carrito.html ---
  function leerCarrito() {
    try { return JSON.parse(localStorage.getItem('carrito') || '[]'); }
    catch (e) { return []; }
  }
  function guardarCarrito(cart) {
    localStorage.setItem('carrito', JSON.stringify(cart));
    actualizarBarraCarrito(cart);
  }
  function actualizarBarraCarrito(cart) {
    const cantidad = cart.reduce(function (sum, item) { return sum + item.cantidad; }, 0);
    const total = cart.reduce(function (sum, item) { return sum + item.cantidad * item.precio_detal; }, 0);
    if (cantidad === 0) {
      cartBar.classList.remove('visible');
      return;
    }
    cartBar.classList.add('visible');
    cartBar.classList.remove('pop');
    void cartBar.offsetWidth; // reinicia la animación aunque ya estuviera visible
    cartBar.classList.add('pop');
    cartBarCantidad.textContent = cantidad + (cantidad === 1 ? ' producto' : ' productos');
    cartBarTotal.textContent = '$' + total.toFixed(2);
  }

  function cambiarCantidadCarrito(variante, delta) {
    const cart = leerCarrito();
    const idx = cart.findIndex(function (item) { return item.variante_id === variante.variante_id; });

    if (idx === -1) {
      if (delta > 0) {
        cart.push({
          variante_id: variante.variante_id,
          producto_id: variante.producto_id,
          nombre: variante.nombre,
          marca: variante.marca,
          tono: variante.tono,
          imagen_url: variante.imagen_tono_url || variante.imagen_url,
          precio_detal: variante.precio_detal,
          precio_mayor: variante.precio_mayor,
          precio_gran_mayor: variante.precio_gran_mayor,
          umbral_mayor: variante.umbral_mayor,
          umbral_gran_mayor: variante.umbral_gran_mayor,
          cantidad: delta
        });
        mostrarToast('✓ Agregado al carrito');
      }
    } else {
      cart[idx].cantidad += delta;
      if (cart[idx].cantidad <= 0) {
        cart.splice(idx, 1);
        mostrarToast('Producto quitado');
      } else if (delta > 0) {
        mostrarToast('✓ Agregado al carrito');
      }
    }
    guardarCarrito(cart);
  }

  function cantidadEnCarrito(varianteId) {
    const item = leerCarrito().find(function (i) { return i.variante_id === varianteId; });
    return item ? item.cantidad : 0;
  }

  // --- Cargar catálogo ---
  async function cargarCatalogo() {
    const { data, error } = await supabaseClient
      .from('catalogo_publico')
      .select('*')
      .order('nombre', { ascending: true });

    if (error) {
      gridEl.innerHTML = '<div class="empty-msg">No se pudo cargar el catálogo. Intenta recargar la página.</div>';
      return;
    }

    todasLasVariantes = data || [];
    construirCategorias();
    renderGrid();
    actualizarBarraCarrito(leerCarrito());
  }

  function construirCategorias() {
    const categorias = Array.from(new Set(
      todasLasVariantes.map(function (v) { return v.categoria; }).filter(Boolean)
    )).sort();

    // La ventana con todas las categorías, en cuadrícula
    catGrid.innerHTML = '';
    ['Todas'].concat(categorias).forEach(function (cat) {
      const btn = document.createElement('button');
      btn.className = cat === categoriaActiva ? 'active' : '';
      btn.textContent = cat;
      btn.addEventListener('click', function () {
        categoriaActiva = cat;
        renderSelectorCategoria();
        renderGrid();
        catOverlay.classList.remove('open');
      });
      catGrid.appendChild(btn);
    });

    renderSelectorCategoria();
  }

  // El botón "Categorías" de arriba, más un chip mostrando la
  // categoría elegida (con su X para volver a "Todas") cuando aplica.
  function renderSelectorCategoria() {
    categoriaSelector.innerHTML =
      '<button type="button" class="btn-categorias" id="abrirCatBtn">Categorías <span class="flecha">▾</span></button>' +
      (categoriaActiva !== 'Todas'
        ? '<span class="categoria-chip-activa">' + categoriaActiva + '<button type="button" id="quitarCatBtn">✕</button></span>'
        : '');

    document.getElementById('abrirCatBtn').addEventListener('click', function () {
      catOverlay.classList.add('open');
    });
    const quitarBtn = document.getElementById('quitarCatBtn');
    if (quitarBtn) {
      quitarBtn.addEventListener('click', function () {
        categoriaActiva = 'Todas';
        construirCategorias();
        renderGrid();
      });
    }
  }

  function agruparPorProducto(variantes) {
    const grupos = {};
    variantes.forEach(function (v) {
      if (!grupos[v.producto_id]) grupos[v.producto_id] = [];
      grupos[v.producto_id].push(v);
    });
    return Object.values(grupos);
  }

  function renderGrid() {
    const termino = searchInput.value.trim().toLowerCase();

    let filtradas = todasLasVariantes;
    if (categoriaActiva !== 'Todas') {
      filtradas = filtradas.filter(function (v) { return v.categoria === categoriaActiva; });
    }
    if (termino) {
      filtradas = filtradas.filter(function (v) {
        return (v.nombre || '').toLowerCase().includes(termino) ||
               (v.marca || '').toLowerCase().includes(termino);
      });
    }

    const grupos = agruparPorProducto(filtradas);

    if (grupos.length === 0) {
      gridEl.innerHTML = '<div class="empty-msg">No encontramos productos con esa búsqueda.</div>';
      return;
    }

    gridEl.innerHTML = '';
    grupos.forEach(function (tonos) {
      const principal = tonos[0];
      const unSoloTono = tonos.length === 1;
      const card = document.createElement('div');
      card.className = 'producto-card';
      card.innerHTML =
        '<img src="' + (principal.imagen_url || '') + '" alt="' + principal.nombre + '" loading="lazy" />' +
        '<div class="info">' +
          (principal.marca ? '<div class="marca">' + principal.marca + '</div>' : '') +
          '<div class="nombre">' + principal.nombre + '</div>' +
          '<div class="precio-fila">' +
            '<span class="precio">$' + Number(principal.precio_detal).toFixed(2) + '</span>' +
            (unSoloTono ? '<button type="button" class="quick-add" data-vid="' + principal.variante_id + '">+</button>' : '') +
          '</div>' +
        '</div>';

      if (unSoloTono) {
        card.querySelector('.quick-add').addEventListener('click', function (e) {
          e.stopPropagation(); // que no se abra la ficha al usar el botón rápido
          cambiarCantidadCarrito(principal, 1);
        });
      }
      card.addEventListener('click', function () { abrirSheet(tonos); });
      gridEl.appendChild(card);
    });
  }

  // --- Modal de producto: elegir tono y cantidad ---
  function abrirSheet(tonos) {
    const principal = tonos[0];
    document.getElementById('sheetImagen').src = principal.imagen_url || '';
    document.getElementById('sheetMarca').textContent = principal.marca || '';
    document.getElementById('sheetNombre').textContent = principal.nombre;
    document.getElementById('sheetDescripcion').textContent = principal.descripcion || '';

    // Los 3 precios son del PRODUCTO, no del tono: se muestran una sola
    // vez, no repetidos en cada fila (antes se veía como si solo
    // existiera el precio detal).
    document.getElementById('sheetPrecios').innerHTML =
      '<div class="precio-nivel"><span class="etiqueta">Detal</span><span class="monto">$' + Number(principal.precio_detal).toFixed(2) + '</span></div>' +
      '<div class="precio-nivel"><span class="etiqueta">Mayor · ' + principal.umbral_mayor + '+ de este producto</span><span class="monto">$' + Number(principal.precio_mayor).toFixed(2) + '</span></div>' +
      '<div class="precio-nivel"><span class="etiqueta">Gran mayor · ' + principal.umbral_gran_mayor + '+ en tu pedido</span><span class="monto">$' + Number(principal.precio_gran_mayor).toFixed(2) + '</span></div>';

    const tonosEl = document.getElementById('sheetTonos');
    tonosEl.innerHTML = '';

    tonos.forEach(function (v) {
      const cantidad = cantidadEnCarrito(v.variante_id);
      const row = document.createElement('div');
      row.className = 'tono-row';
      row.innerHTML =
        '<div>' +
          '<div class="tono-nombre">' + (v.tono || 'Único') + '</div>' +
          '<div class="tono-precio">$' + Number(v.precio_detal).toFixed(2) + '</div>' +
        '</div>' +
        '<div class="qty-controls">' +
          '<button type="button" class="restar-tono" data-vid="' + v.variante_id + '"' + (cantidad === 0 ? ' disabled' : '') + '>−</button>' +
          '<span>' + cantidad + '</span>' +
          '<button type="button" class="sumar-tono" data-vid="' + v.variante_id + '">+</button>' +
        '</div>';

      row.querySelector('.sumar-tono').addEventListener('click', function () {
        cambiarCantidadCarrito(v, 1);
        abrirSheet(tonos); // re-render para mostrar la cantidad actualizada
      });
      row.querySelector('.restar-tono').addEventListener('click', function () {
        cambiarCantidadCarrito(v, -1);
        abrirSheet(tonos);
      });
      tonosEl.appendChild(row);
    });

    overlay.classList.add('open');
  }

  document.getElementById('cerrarSheetBtn').addEventListener('click', function () {
    overlay.classList.remove('open');
  });
  overlay.addEventListener('click', function (e) {
    if (e.target === overlay) overlay.classList.remove('open');
  });

  document.getElementById('cerrarCatSheetBtn').addEventListener('click', function () {
    catOverlay.classList.remove('open');
  });
  catOverlay.addEventListener('click', function (e) {
    if (e.target === catOverlay) catOverlay.classList.remove('open');
  });

  searchInput.addEventListener('input', renderGrid);

  cargarCatalogo();
</script>
</body>
</html>
